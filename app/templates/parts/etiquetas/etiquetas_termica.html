<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>InOutControl — Etiqueta Térmica (80mm)</title>
    <style>
        @page {
            size: 80mm 40mm;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            -webkit-print-color-adjust: exact;
        }
        .etq-box {
            width: 80mm;
            height: 40mm;
            box-sizing: border-box;
            padding: 2.5mm 4mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            page-break-after: always;
            border-bottom: 1px dashed #cbd5e1;
        }
        .etq-nome {
            font-size: 9.5pt;
            font-weight: bold;
            color: #000000;
            line-height: 1.15;
            max-height: 2.3em;
            overflow: hidden;
        }
        .etq-marca {
            font-size: 7.5pt;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
        }
        .etq-barcode-container {
            width: 100%;
            height: 16mm;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .etq-barcode-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .etq-codigo-texto {
            font-size: 9pt;
            font-family: 'Courier New', Courier, monospace;
            color: #111827;
            font-weight: bold;
            letter-spacing: 1px;
        }
        @media print {
            .etq-box {
                border-bottom: none;
            }
        }
    </style>
</head>
<body>

{% for e in etiquetas %}
<div class="etq-box">
    <div>
        <div class="etq-nome">{{ e.nome }}</div>
        {% if e.marca %}<div class="etq-marca">[{{ e.marca }}]</div>{% endif %}
    </div>
    
    <div class="etq-barcode-container">
        {% if e.barcode %}
            <img src="data:image/png;base64,{{ e.barcode }}" alt="Código de Barras">
        {% else %}
            <span style="font-size: 8pt; color: red;">[Sem Código]</span>
        {% endif %}
    </div>
    
    <div class="etq-codigo-texto">{{ e.codigo }}</div>
</div>
{% endfor %}

</body>
</html>
