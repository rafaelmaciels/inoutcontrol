<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>InOutControl — Etiqueta Térmica Bipável</title>
    <style>
        /* CONFIGURAÇÃO DA PÁGINA (Padrão térmico 80mmx40mm) */
        @page {
            size: 80mm 40mm;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            -webkit-print-color-adjust: exact;
        }

        /* O CONTAINER DA ETIQUETA */
        .etq-box {
            width: 80mm;
            height: 40mm;
            box-sizing: border-box;
            padding: 3mm 5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribui os elementos verticalmente */
            align-items: center;
            text-align: center;
            page-break-after: always; 
        }

        /* TIPOGRAFIA */
        .etq-nome {
            font-size: 10pt;
            font-weight: bold;
            color: #000000;
            line-height: 1.2;
            max-height: 2.4em; /* Limita estritamente a 2 linhas */
            overflow: hidden;
            margin-bottom: 1mm;
        }

        /* CONTAINER DO CÓDIGO DE BARRAS */
        .etq-barcode-container {
            width: 100%;
            height: 16mm; /* Espaço ideal para o feixe do scanner */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .etq-barcode-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .etq-codigo-texto {
            font-size: 9pt;
            font-family: 'Courier New', Courier, monospace;
            color: #333333;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 1mm;
        }
    </style>
</head>

<body>

{% for e in etiquetas %}
<div class="etq-box">
    
    <!-- 1. Nome da Peça na parte superior -->
    <div class="etq-nome">{{ e.nome }}</div>
    
    <!-- 2. Código de Barras centralizado para o Scanner Bipar -->
    <div class="etq-barcode-container">
        {% if e.barcode %}
            <img src="data:image/png;base64,{{ e.barcode }}" alt="Código de Barras">
        {% else %}
            <span style="font-size: 8pt; color: red;">[Erro: Sem Código]</span>
        {% endif %}
    </div>
    
    <!-- 3. Texto legível do código embaixo (caso o leitor quebre e precise digitar) -->
    <div class="etq-codigo-texto">{{ e.codigo }}</div>

</div>
{% endfor %}

</body>
</html>
